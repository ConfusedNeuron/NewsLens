name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifacts/newslens-backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: artifacts/newslens-backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Run tests
        # No API key is set, and none is needed: every test either mocks the LLM
        # or asserts the no-key degradation path. If a test ever starts requiring
        # network access, this job is where it will be caught.
        run: pytest tests/ -q

      - name: Check every module imports cleanly
        run: python -m compileall -q agents api config db pipeline
